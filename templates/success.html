<!DOCTYPE html>
<html lang="en">
<head>

<body class="ff-bg">
    <div class="container" style="max-width: 600px; margin: 50px auto; background: rgba(15, 23, 42, 0.95); padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);">
        
        <!-- Success Icon -->
        <div style="font-size: 64px; color: #10B981; margin-bottom: 20px;">

            <a href="YOUR_WHATSAPP_COMMUNITY_LINK_HERE" target="_blank" style="background-color: #25D366; color: white; padding: 14px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.2s;">

        <!-- Back to Home -->

            <a href="{{ url_for('home') }}" style="color: #60A5FA; text-decoration: none; font-size: 14px;">
